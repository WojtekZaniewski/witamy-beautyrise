<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111111" />
  <title>BeautyRise</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header" id="header">
    <div class="container">
      <div class="header__inner">
        <a href="/" class="header__logo">BeautyRise</a>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="splash" id="hero">

      <p class="splash__heading">Zanim przejdziesz dalej,<br>obejrzyj <em class="splash__highlight">filmik</em>.</p>

      <div class="splash__video">
        <button class="splash__play" aria-label="Odtwórz filmik">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M8 5.14v14l11-7-11-7z"/>
          </svg>
        </button>
        <span class="splash__all">wszystkim</span>
      </div>

      <a href="#dalej" class="splash__arrow" aria-label="Przewiń dalej">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 5v14M5 12l7 7 7-7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </a>

    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
